{{- range $key, $service := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    app: {{ $service.name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ $service.name }}
  template:
    metadata:
      labels:
        app: {{ $service.name }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $service.name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $service.image }}:{{ $service.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          {{- if ne $service.name "gateway-service" }}
          env:
            - name: DB_HOST
              value: {{ $.Values.database.host | quote }}

            - name: DB_PORT
              value: {{ $.Values.database.port | quote }}

            - name: DB_NAME
              value: {{ $.Values.database.name | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: crm-db-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-db-secret
                  key: DB_PASSWORD
{{- end }}

{{- if eq $service.name "gateway-service" }}
          envFrom:
            - configMapRef:
                name: gateway-config
{{- end }}

          ports:
            - name: http
              containerPort: {{ $service.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
---
{{- end }}
